[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftoolkit"
version = "0.1.0"
description = "A complete, offline command-line toolkit for manipulating PDF files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "smolkai", email = "smolkai@users.noreply.github.com" }]
keywords = ["pdf", "merge", "split", "rotate", "extract", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=4.0.0",
    # Page.get_images() (used by extract-images to enumerate a page's images,
    # including those nested in form XObjects) was only added in pikepdf 10.9.0.
    # On older releases the command would raise AttributeError, so require it.
    "pikepdf>=10.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "reportlab>=4.0.0",
    # The extract-images tests decode extracted images with Pillow and build
    # JPEG fixtures with it. pikepdf pulls Pillow in transitively, but the
    # tests import it directly, so declare it explicitly.
    "Pillow>=9.0.0",
]

[project.scripts]
pdftoolkit = "pdftoolkit.cli:main"

[project.urls]
Homepage = "https://github.com/smolkapps/pdf-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
